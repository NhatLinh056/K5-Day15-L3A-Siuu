# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng mẫu bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 145
  base: 436
  high: 721
  source: "data/preclass/ (BTC cấp): 145 học viên hỏi dưới video, 436 học viên có hoạt động, 721 tài khoản học viên (evidence/data-mining.md §1)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.28             # tỉ lệ người dùng kiểu này
    uses_per_month: 2       # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "data/preclass/chat.csv: 40/145 (27,6%) học viên chỉ hỏi 1 câu trong 21 ngày (evidence/data-mining.md §3)"
  - name: dung_vua
    share: 0.29
    uses_per_month: 6
    turns_per_session: 1
    source: "data/preclass/chat.csv: 42/145 (29,0%) học viên hỏi 2–5 câu trong 21 ngày (evidence/data-mining.md §3)"
  - name: dung_nhieu
    share: 0.43
    uses_per_month: 20
    turns_per_session: 2
    source: "data/preclass/chat.csv: 63/145 (43,4%) học viên hỏi ≥6 câu trong 21 ngày (evidence/data-mining.md §3)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-2.0-flash
    input: 0.10
    output: 0.40
    source: "https://ai.google.dev/pricing · bảng giá Gemini 2.0 Flash xem 25/11/2026"
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://openai.com/api/pricing/ · bảng giá GPT-4o-mini xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
